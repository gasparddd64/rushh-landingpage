<text x="76" y="204" fill="#17253D" font-size="17" font-weight="600">Vendeur</text><text x="76" y="227" fill="#61718A" font-size="14">Estimation</text>
<text x="76" y="374" fill="#17253D" font-size="17" font-weight="600">Acquéreur</text><text x="76" y="397" fill="#61718A" font-size="14">Recherche de bien</text>
</g>
